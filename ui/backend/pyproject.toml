[project]
name = "sushi-ui"
version = "0.1.0"
description = "Web UI for launching and tracking sushi pipeline runs."
# 3.10 for the `X | None` annotations FastAPI resolves at import time.
# vercingetorix-r8 has 3.11.5 via the python:3.11 AppStream module.
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    # fastapi.testclient needs it; not installed by `uv sync --no-dev`.
    "httpx>=0.27",
]

[tool.uv]
# Flat modules run from this directory, not an installable package.
package = false
